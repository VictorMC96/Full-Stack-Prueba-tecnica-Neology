spring:
  application:
    name: Parking
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: 123456789
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddlAuto: update
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8081
springdoc:
  swagger-ui.path: /swagger-ui.html
