<div class="rounded-xl border border-neutral-200 bg-white">
  <table mat-table [dataSource]="vehicles()" class="w-full">
    <ng-container matColumnDef="licensePlate">
      <th mat-header-cell *matHeaderCellDef>Placa</th>
      <td mat-cell *matCellDef="let v">{{ v.licensePlate }}</td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Tipo</th>
      <td mat-cell *matCellDef="let v">{{ v.type }}</td>
    </ng-container>

    <ng-container matColumnDef="brand">
      <th mat-header-cell *matHeaderCellDef>Marca</th>
      <td mat-cell *matCellDef="let v">{{ v.brand || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="model">
      <th mat-header-cell *matHeaderCellDef>Modelo</th>
      <td mat-cell *matCellDef="let v">{{ v.model || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="color">
      <th mat-header-cell *matHeaderCellDef>Color</th>
      <td mat-cell *matCellDef="let v">{{ v.color || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="text-right">Acciones</th>
      <td mat-cell *matCellDef="let v" class="text-right">
        <button mat-flat-button class="!bg-green-600 !text-white" (click)="onDetail(v)">
          Detalle
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (vehicles().length === 0 && !loading()) {
    <p class="p-6 text-sm text-neutral-500">No hay vehículos registrados.</p>
  }

  <mat-paginator
    [length]="total()"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    [pageSizeOptions]="[5, 10, 20, 50]"
    (page)="onPage($event)"
  />
</div>
