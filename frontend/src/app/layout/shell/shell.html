<a class="saltar" href="#contenido">Saltar al contenido</a>
<mat-toolbar class="barra">
  @if (esMovil()) {
    <button matIconButton aria-label="Abrir menú de navegación" (click)="sidenav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
  }
  <span class="titulo">Gestión de Acceso Vehicular</span>
</mat-toolbar>
<mat-sidenav-container class="contenedor">
  <mat-sidenav
    #sidenav
    class="lateral"
    [mode]="esMovil() ? 'over' : 'side'"
    [opened]="!esMovil()"
    [fixedInViewport]="esMovil()"
    [fixedTopGap]="64"
  >
    <nav aria-label="Secciones">
      <mat-nav-list>
        @for (enlace of enlaces; track enlace.ruta) {
          <a
            mat-list-item
            [routerLink]="enlace.ruta"
            routerLinkActive="activo"
            ariaCurrentWhenActive="page"
            (click)="esMovil() && sidenav.close()"
          >
            <mat-icon matListItemIcon>{{ enlace.icono }}</mat-icon>
            <span matListItemTitle>{{ enlace.etiqueta }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>
  <mat-sidenav-content>
    <main id="contenido" class="principal" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
